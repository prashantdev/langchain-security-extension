[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-security-extension"
version = "0.1.0"
description = "Enterprise RBAC and Attribute-Based Access Control (ABAC) security framework for LangChain and LangGraph AI applications."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "LangChain Security Team" }
]
keywords = ["security", "langchain", "langgraph", "rbac", "abac", "ai-security", "cel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0",
    "langgraph>=0.0.10",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
security_core = ["py.typed"]
security_adapter_langchain = ["py.typed"]
